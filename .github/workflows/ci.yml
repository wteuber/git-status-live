name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The minimum from go.mod (required by golang.org/x/term) and the latest release.
        go: ['1.26', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Vet
        run: go vet ./...
      # The tests include a run of the real git binary against a temporary repo.
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/git-live

  lint:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Test with race detector and coverage
        run: go test -race -coverprofile=coverage.out ./...
      # Everything except the terminal setup (raw mode, alternate screen) is
      # tested; keep it that way. Raise the minimum when coverage goes up.
      - name: Check coverage (minimum 89%)
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          echo "Total coverage: ${total}%"
          awk -v total="$total" 'BEGIN { exit !(total >= 89) }' || { echo "::error::Coverage ${total}% is below the 89% minimum"; exit 1; }
